<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gincana do Mineiro 💋</title>
<style>
  :root { --gold: #e8c477; --cream: #fff0d0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #21190e 0%, #0b0a08 55%, #030303 100%);
    color: var(--cream); font-family: Georgia, 'Times New Roman', serif;
  }
  .card {
    width: min(900px, 92vw); text-align: center; padding: 56px 24px;
    border: 1px solid rgba(232,196,119,.3); border-radius: 24px;
    background: rgba(12,10,7,.78); box-shadow: 0 0 70px rgba(232,196,119,.08);
    position: relative; z-index: 1;
  }
  .ornament { color: var(--gold); letter-spacing: 8px; margin-bottom: 28px; font-size: 20px; }
  h1 { font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: 1.12; margin: 0 auto 18px; max-width: 780px; font-weight: 600; }
  p { color: #c7b99e; font-family: Arial, sans-serif; font-size: 1rem; margin: 0 0 38px; }
  .play-area { position: relative; width: min(520px, 100%); height: 150px; margin: 0 auto; }
  button {
    position: absolute; top: 28px; width: 170px; height: 62px; border-radius: 999px;
    font-size: 1.35rem; cursor: pointer; transition: left .18s ease, top .18s ease, transform .18s ease;
    font-family: Georgia, serif;
  }
  #yes { left: calc(50% - 185px); border: 1px solid var(--gold); background: linear-gradient(135deg,#f7df9d,#c89b45); color: #211607; box-shadow: 0 0 24px #d5a84b35; }
  #yes:hover { transform: scale(1.06); }
  #no { left: calc(50% + 15px); border: 1px solid #9c9588; background: #171614; color: #f4eee3; }
  #message { min-height: 30px; margin-top: 18px; color: var(--gold); font: 600 1.1rem Arial, sans-serif; }
  #reset { display:none; position:relative; top:auto; left:auto; width:auto; height:auto; padding:12px 22px; margin: 12px auto 0; border:1px solid #b9a06d; background:transparent; color:var(--cream); font:600 .95rem Arial,sans-serif; }
  #reset:hover { background:#e8c47718; }
  .small { margin-top: 18px; font: 12px Arial, sans-serif; color: #756b59; }
  .confetti { position:fixed; top:-20px; width:10px; height:15px; z-index:5; pointer-events:none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(900deg); opacity:.9; } }
  .card.celebrate { animation: pop .55s ease; }
  @keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.035)} 100%{transform:scale(1)} }
  .heart { position:fixed; bottom:-40px; z-index:4; pointer-events:none; animation: float-up 2.6s ease-out forwards; }
  @keyframes float-up { 0%{transform:translateY(0) scale(.6);opacity:0} 15%{opacity:1} 100%{transform:translateY(-110vh) scale(1.4) rotate(25deg);opacity:0} }
  @media (max-width: 520px) {
    .card { padding: 42px 14px; }
    .play-area { height: 190px; }
    button { width: 135px; }
    #yes { left: calc(50% - 150px); }
    #no { left: calc(50% + 15px); }
  }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="ornament">────── ♥ ──────</div>
    <h1>Você beijaria o Matheus vulgo Mineiro?</h1>
    <p id="subtitle">Escolha com sinceridade… se conseguir 😏</p>
    <div class="play-area" id="playArea">
      <button id="yes" type="button">Sim 💋</button>
      <button id="no" type="button">Não 🙅</button>
    </div>
    <div id="message" aria-live="polite"></div>
    <button id="reset" type="button">↻ Escolher novamente</button>
   
  </main>
<script>
  const noButton = document.getElementById('no');
  const yesButton = document.getElementById('yes');
  const area = document.getElementById('playArea');
  const message = document.getElementById('message');
  const resetButton = document.getElementById('reset');
  const subtitle = document.getElementById('subtitle');
  const card = document.getElementById('card');
  let celebrationTimer;

  function runAway() {
    if (yesButton.disabled) return;
    const maxX = Math.max(0, area.clientWidth - noButton.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - noButton.offsetHeight);
    noButton.style.left = Math.random() * maxX + 'px';
    noButton.style.top = Math.random() * maxY + 'px';
    noButton.style.transform = `rotate(${Math.random() * 24 - 12}deg)`;
  }
  noButton.addEventListener('mouseenter', runAway);
  noButton.addEventListener('pointerdown', (event) => { event.preventDefault(); runAway(); });
  noButton.addEventListener('focus', runAway);

  function celebrate() {
    yesButton.disabled = true;
    noButton.style.display = 'none';
    yesButton.style.position = 'relative';
    yesButton.style.left = 'auto';
    yesButton.style.top = 'auto';
    yesButton.style.display = 'block';
    yesButton.style.margin = '0 auto';
    yesButton.textContent = 'SIM! 💖';
    subtitle.textContent = 'Resposta registrada com sucesso!';
    message.textContent = 'Aí sim! O Mineiro já pode comemorar 😎💖';
    resetButton.style.display = 'block';
    card.classList.remove('celebrate');
    void card.offsetWidth;
    card.classList.add('celebrate');

    const colors = ['#e8c477', '#fff0d0', '#d85b7a', '#f4f0e8', '#8fc7a5'];
    for (let i = 0; i < 100; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      piece.style.setProperty('--drift', (Math.random() * 240 - 120) + 'px');
      piece.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
      piece.style.animationDelay = (Math.random() * .7) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 5500);
    }
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = ['💖','💋','💕','✨'][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (18 + Math.random() * 24) + 'px';
      heart.style.animationDelay = (Math.random() * 1.2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4500);
    }
  }

  yesButton.addEventListener('click', celebrate);
  resetButton.addEventListener('click', () => {
    document.querySelectorAll('.confetti, .heart').forEach(el => el.remove());
    yesButton.disabled = false;
    yesButton.textContent = 'Sim 💋';
    yesButton.style.position = 'absolute';
    yesButton.style.left = window.matchMedia('(max-width: 520px)').matches ? 'calc(50% - 150px)' : 'calc(50% - 185px)';
    yesButton.style.top = '28px';
    yesButton.style.margin = '0';
    noButton.style.display = 'block';
    noButton.style.left = window.matchMedia('(max-width: 520px)').matches ? 'calc(50% + 15px)' : 'calc(50% + 15px)';
    noButton.style.top = '28px';
    noButton.style.transform = 'none';
    subtitle.textContent = 'Escolha com sinceridade… se conseguir 😏';
    message.textContent = '';
    resetButton.style.display = 'none';
    card.classList.remove('celebrate');
  });
  window.addEventListener('resize', () => {
    if (!yesButton.disabled) {
      noButton.style.left = 'calc(50% + 15px)';
      noButton.style.top = '28px';
    }
  });
</script>
</body>
</html>
